<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MAF Tech Academy – Interactive Computer Science Course</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Bricolage+Grotesque:wght@700;800&display=swap" rel="stylesheet">
</head>
<body>
  <!-- SIDEBAR -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <div class="logo">MAF TECH</div>
      <div class="logo-sub">Academy</div>
    </div>
    <nav id="module-nav">
      <!-- Filled by JS -->
    </nav>
    <div class="sidebar-footer">
      <button id="reset-progress" class="btn-text">Reset Progress</button>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <main id="main">
    <header class="topbar">
      <button id="menu-toggle" class="menu-btn">☰</button>
      <div class="progress-wrap">
        <div class="progress-label">Course Progress</div>
        <div class="progress-bar"><div id="progress-fill"></div></div>
        <div id="progress-text">0%</div>
      </div>
    </header>

    <div id="content">
      <!-- Dynamic content injected here -->
    </div>
  </main>

  <script src="course-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
